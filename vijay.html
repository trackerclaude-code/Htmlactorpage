<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute & Cozy Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 50%, #e8dbfc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background-color: rgba(164, 213, 121, 0.9);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 4px solid #fff;
        }

        .avatar-container {
            font-size: 50px;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h2 {
            color: #ff7096;
            margin-bottom: 5px;
            font-size: 28px;
        }

        p.subtitle {
            color: #9c8fb3;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ff7096;
            font-weight: 600;
            font-size: 14px;
            padding-left: 5px;
        }

        input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid #ffe5ec;
            border-radius: 20px;
            background-color: #fffafb;
            color: #705e78;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #ffb3c6;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(255, 179, 198, 0.3);
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            color: #9c8fb3;
            cursor: pointer;
        }

        .remember-me input {
            width: auto;
            margin-right: 6px;
            cursor: pointer;
        }

        .forgot-pass {
            color: #ff7096;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-pass:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff7096, #ff94b3);
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 112, 150, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 112, 150, 0.6);
        }

        .login-btn:active {
            transform: translateY(1px);
        }

        .signup-text {
            margin-top: 25px;
            font-size: 14px;
            color: #9c8fb3;
        }

        .signup-text a {
            color: #b583ff;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="avatar-container">👋💖</div>
        <h2>Welcome Back!</h2>
        <p class="subtitle">We're so happy to see you again!</p>
        
        <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Logging in... ✨');">
            <div class="input-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" placeholder="e.g., cutiepie123" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <div class="options-row">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-pass">Forgot password?</a>
            </div>
            
            <button type="submit" class="login-btn">Log In ✨</button>
        </form>
        
        <p class="signup-text">New here? <a href="#">Create an account!</a></p>
    </div>

</body>
</html>
